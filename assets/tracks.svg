<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-label="Phosphor track view, animated">
  <defs>
    <clipPath id="tframe"><rect x="2" y="2" width="1076" height="466" rx="14"/></clipPath>
    <clipPath id="lane"><rect x="380" y="88" width="656" height="316"/></clipPath>
    <pattern id="tscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect y="3" width="4" height="1" fill="#03110d" opacity="0.5"/>
    </pattern>
    <filter id="phead" x="-300%" y="-20%" width="700%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="1076" height="466" rx="14" fill="#0a1216" stroke="#1e3a35" stroke-width="2"/>

  <g clip-path="url(#tframe)" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">
    <!-- title bar -->
    <rect x="2" y="2" width="1076" height="34" fill="#0d1a1f"/>
    <circle cx="26" cy="19" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="19" r="6" fill="#ffbd2e"/>
    <circle cx="70" cy="19" r="6" fill="#27c93f"/>
    <text x="540" y="24" text-anchor="middle" font-size="13" fill="#3f6a62">phosphor — session: demo.phos</text>

    <!-- transport strip -->
    <text x="28" y="66" font-size="15" fill="#7fffd4">▶ PLAYING</text>
    <text x="150" y="66" font-size="15" fill="#6fa8a0">118 BPM</text>
    <text x="248" y="66" font-size="15" fill="#6fa8a0">4/4</text>
    <text x="306" y="66" font-size="15" fill="#8f7fd8">loop 1–8</text>
    <text x="418" y="66" font-size="15" fill="#e06c75">● REC
      <animate attributeName="opacity" values="1;1;0.25;0.25" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="1052" y="66" font-size="15" fill="#3f6a62" text-anchor="end">MIDI: connected</text>

    <!-- column rule -->
    <line x1="372" y1="86" x2="372" y2="406" stroke="#12241f" stroke-width="2"/>

    <!-- ══ track rows: name / M S / VU / clips ══ -->
    <!-- row template geometry: y = 96 + i*52, row height 44 -->

    <!-- selector highlight, stepping -->
    <rect x="14" y="92" width="1050" height="46" rx="8" fill="#7fffd4" opacity="0.06" stroke="#7fffd4" stroke-opacity="0.55">
      <animate attributeName="y" values="92;144;196;248;300;352;92" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- DRUMS -->
    <g transform="translate(0,96)">
      <text x="28" y="27" font-size="16" fill="#e06c75">01 DRUMS·909</text>
      <rect x="196" y="10" width="24" height="24" rx="4" fill="#12241f"/><text x="208" y="27" font-size="13" fill="#4a7a70" text-anchor="middle">M</text>
      <rect x="226" y="10" width="24" height="24" rx="4" fill="#12241f"/><text x="238" y="27" font-size="13" fill="#4a7a70" text-anchor="middle">S</text>
      <rect x="262" y="16" width="100" height="12" rx="3" fill="#0f2019"/>
      <rect x="262" y="16" width="100" height="12" rx="3" fill="#e06c75" opacity="0.85">
        <animate attributeName="width" values="62;88;40;95;55;78;62" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- PROPHET-6 -->
    <g transform="translate(0,148)">
      <text x="28" y="27" font-size="16" fill="#61afef">02 PROPHET-6</text>
      <rect x="196" y="10" width="24" height="24" rx="4" fill="#12241f"/><text x="208" y="27" font-size="13" fill="#4a7a70" text-anchor="middle">M</text>
      <rect x="226" y="10" width="24" height="24" rx="4" fill="#12241f"/><text x="238" y="27" font-size="13" fill="#4a7a70" text-anchor="middle">S</text>
      <rect x="262" y="16" width="100" height="12" rx="3" fill="#0f2019"/>
      <rect x="262" y="16" width="100" height="12" rx="3" fill="#61afef" opacity="0.85">
        <animate attributeName="width" values="48;70;84;52;66;90;48" dur="1.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- DX7 -->
    <g transform="translate(0,200)">
      <text x="28" y="27" font-size="16" fill="#c678dd">03 DX7·EPIANO</text>
      <rect x="196" y="10" width="24" height="24" rx="4" fill="#12241f"/><text x="208" y="27" font-size="13" fill="#4a7a70" text-anchor="middle">M</text>
      <rect x="226" y="10" width="24" height="24" rx="4" fill="#12241f"/><text x="238" y="27" font-size="13" fill="#4a7a70" text-anchor="middle">S</text>
      <rect x="262" y="16" width="100" height="12" rx="3" fill="#0f2019"/>
      <rect x="262" y="16" width="100" height="12" rx="3" fill="#c678dd" opacity="0.85">
        <animate attributeName="width" values="30;58;44;72;36;60;30" dur="1.15s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- JUPITER-8 -->
    <g transform="translate(0,252)">
      <text x="28" y="27" font-size="16" fill="#98c379">04 JUPITER-8</text>
      <rect x="196" y="10" width="24" height="24" rx="4" fill="#12241f"/><text x="208" y="27" font-size="13" fill="#4a7a70" text-anchor="middle">M</text>
      <rect x="226" y="10" width="24" height="24" rx="4" fill="#98c379" opacity="0.35"/><text x="238" y="27" font-size="13" fill="#c8e6b0" text-anchor="middle">S</text>
      <rect x="262" y="16" width="100" height="12" rx="3" fill="#0f2019"/>
      <rect x="262" y="16" width="100" height="12" rx="3" fill="#98c379" opacity="0.85">
        <animate attributeName="width" values="70;46;88;58;76;50;70" dur="1.7s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- RHODES -->
    <g transform="translate(0,304)">
      <text x="28" y="27" font-size="16" fill="#e5c07b">05 RHODES·MK1</text>
      <rect x="196" y="10" width="24" height="24" rx="4" fill="#12241f"/><text x="208" y="27" font-size="13" fill="#4a7a70" text-anchor="middle">M</text>
      <rect x="226" y="10" width="24" height="24" rx="4" fill="#12241f"/><text x="238" y="27" font-size="13" fill="#4a7a70" text-anchor="middle">S</text>
      <rect x="262" y="16" width="100" height="12" rx="3" fill="#0f2019"/>
      <rect x="262" y="16" width="100" height="12" rx="3" fill="#e5c07b" opacity="0.85">
        <animate attributeName="width" values="40;64;30;56;80;44;40" dur="1.3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- PHATTY -->
    <g transform="translate(0,356)">
      <text x="28" y="27" font-size="16" fill="#56b6c2">06 PHATTY·BASS</text>
      <rect x="196" y="10" width="24" height="24" rx="4" fill="#56b6c2" opacity="0.35"/><text x="208" y="27" font-size="13" fill="#bde8ee" text-anchor="middle">M</text>
      <rect x="226" y="10" width="24" height="24" rx="4" fill="#12241f"/><text x="238" y="27" font-size="13" fill="#4a7a70" text-anchor="middle">S</text>
      <rect x="262" y="16" width="100" height="12" rx="3" fill="#0f2019"/>
      <rect x="262" y="16" width="100" height="12" rx="3" fill="#56b6c2" opacity="0.85">
        <animate attributeName="width" values="82;58;92;66;74;96;82" dur="1.0s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- clip lane -->
    <g clip-path="url(#lane)">
      <!-- beat grid -->
      <g stroke="#0f2019" stroke-width="1">
        <line x1="462" y1="88" x2="462" y2="404"/><line x1="544" y1="88" x2="544" y2="404"/>
        <line x1="626" y1="88" x2="626" y2="404"/><line x1="708" y1="88" x2="708" y2="404"/>
        <line x1="790" y1="88" x2="790" y2="404"/><line x1="872" y1="88" x2="872" y2="404"/>
        <line x1="954" y1="88" x2="954" y2="404"/>
      </g>
      <!-- clips: x spans within 380..1036 -->
      <rect x="380" y="98" width="328" height="34" rx="6" fill="#e06c75" opacity="0.22" stroke="#e06c75" stroke-opacity="0.7"/>
      <rect x="708" y="98" width="328" height="34" rx="6" fill="#e06c75" opacity="0.22" stroke="#e06c75" stroke-opacity="0.7"/>
      <rect x="380" y="150" width="492" height="34" rx="6" fill="#61afef" opacity="0.22" stroke="#61afef" stroke-opacity="0.7"/>
      <rect x="462" y="202" width="246" height="34" rx="6" fill="#c678dd" opacity="0.22" stroke="#c678dd" stroke-opacity="0.7"/>
      <rect x="790" y="202" width="164" height="34" rx="6" fill="#c678dd" opacity="0.22" stroke="#c678dd" stroke-opacity="0.7"/>
      <rect x="544" y="254" width="410" height="34" rx="6" fill="#98c379" opacity="0.22" stroke="#98c379" stroke-opacity="0.7"/>
      <rect x="380" y="306" width="164" height="34" rx="6" fill="#e5c07b" opacity="0.22" stroke="#e5c07b" stroke-opacity="0.7"/>
      <rect x="626" y="306" width="246" height="34" rx="6" fill="#e5c07b" opacity="0.22" stroke="#e5c07b" stroke-opacity="0.7"/>
      <rect x="380" y="358" width="656" height="34" rx="6" fill="#56b6c2" opacity="0.22" stroke="#56b6c2" stroke-opacity="0.7"/>
      <!-- mini note dashes inside a few clips -->
      <g fill="#aef7e4" opacity="0.5">
        <rect x="392" y="162" width="26" height="4" rx="2"/><rect x="430" y="170" width="18" height="4" rx="2"/>
        <rect x="472" y="158" width="30" height="4" rx="2"/><rect x="560" y="166" width="22" height="4" rx="2"/>
        <rect x="640" y="160" width="26" height="4" rx="2"/><rect x="700" y="170" width="20" height="4" rx="2"/>
        <rect x="474" y="214" width="22" height="4" rx="2"/><rect x="520" y="222" width="28" height="4" rx="2"/>
        <rect x="584" y="216" width="18" height="4" rx="2"/>
        <rect x="556" y="266" width="30" height="4" rx="2"/><rect x="620" y="274" width="22" height="4" rx="2"/>
        <rect x="700" y="268" width="26" height="4" rx="2"/><rect x="780" y="276" width="18" height="4" rx="2"/>
        <rect x="392" y="370" width="40" height="4" rx="2"/><rect x="460" y="378" width="32" height="4" rx="2"/>
        <rect x="540" y="372" width="44" height="4" rx="2"/><rect x="640" y="380" width="36" height="4" rx="2"/>
        <rect x="760" y="374" width="40" height="4" rx="2"/><rect x="880" y="378" width="34" height="4" rx="2"/>
      </g>
      <!-- playhead -->
      <g filter="url(#phead)">
        <line x1="0" y1="88" x2="0" y2="404" stroke="#7fffd4" stroke-width="2.5">
          <animate attributeName="x1" values="380;1036" dur="7s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="380;1036" dur="7s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>

    <!-- loop markers -->
    <text x="380" y="424" font-size="12" fill="#8f7fd8">◀ loop</text>
    <text x="1036" y="424" font-size="12" fill="#8f7fd8" text-anchor="end">loop ▶</text>

    <!-- bottom bar -->
    <rect x="2" y="436" width="1076" height="32" fill="#0d1a1f"/>
    <text x="28" y="457" font-size="13" fill="#4a7a70">SPC menu   j/k tracks   m mute   s solo   r arm   TAB piano roll   Ctrl+S save</text>
    <text x="1052" y="457" font-size="13" fill="#3f6a62" text-anchor="end">theme: phosphor</text>

    <rect x="2" y="2" width="1076" height="466" fill="url(#tscan)"/>
  </g>
</svg>
