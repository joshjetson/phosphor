<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Phosphor — a terminal-native DAW built in Rust">
  <defs>
    <clipPath id="frame"><rect x="2" y="2" width="1276" height="296" rx="14"/></clipPath>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fffd4"/>
      <stop offset="0.55" stop-color="#4fe3c0"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
    <linearGradient id="vu" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1f8f7a"/>
      <stop offset="0.7" stop-color="#4fe3c0"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#aef7e4" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect y="3" width="4" height="1" fill="#03110d" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- terminal frame -->
  <rect x="2" y="2" width="1276" height="296" rx="14" fill="#0a1216" stroke="#1e3a35" stroke-width="2"/>

  <g clip-path="url(#frame)">
    <!-- title bar -->
    <rect x="2" y="2" width="1276" height="34" fill="#0d1a1f"/>
    <circle cx="26" cy="19" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="19" r="6" fill="#ffbd2e"/>
    <circle cx="70" cy="19" r="6" fill="#27c93f"/>
    <text x="640" y="24" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="13" fill="#3f6a62">phosphor — audio engine: live — 48000 Hz</text>

    <!-- oscilloscope waves, seamless scroll (period 160 / 80) -->
    <g opacity="0.4" filter="url(#softglow)">
      <g>
        <path d="M -160 150 Q -120 96 -80 150 T 0 150 T 80 150 T 160 150 T 240 150 T 320 150 T 400 150 T 480 150 T 560 150 T 640 150 T 720 150 T 800 150 T 880 150 T 960 150 T 1040 150 T 1120 150 T 1200 150 T 1280 150 T 1360 150 T 1440 150" fill="none" stroke="#2aa198" stroke-width="2.5"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="1.9s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.5">
        <path d="M -80 150 Q -60 128 -40 150 T 0 150 T 40 150 T 80 150 T 120 150 T 160 150 T 200 150 T 240 150 T 280 150 T 320 150 T 360 150 T 400 150 T 440 150 T 480 150 T 520 150 T 560 150 T 600 150 T 640 150 T 680 150 T 720 150 T 760 150 T 800 150 T 840 150 T 880 150 T 920 150 T 960 150 T 1000 150 T 1040 150 T 1080 150 T 1120 150 T 1160 150 T 1200 150 T 1240 150 T 1280 150 T 1320 150 T 1360 150" fill="none" stroke="#4fe3c0" stroke-width="1.5"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="1.15s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- wordmark: statically visible; motion is a subtle CRT glow pulse -->
    <g filter="url(#glow)">
      <text x="64" y="158" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="86" font-weight="700" letter-spacing="6" fill="url(#word)" textLength="620" lengthAdjust="spacingAndGlyphs">PHOSPHOR
        <animate attributeName="opacity" values="1;0.86;1;0.94;1" dur="3.4s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- block cursor -->
    <rect x="702" y="92" width="34" height="72" fill="#7fffd4" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.9;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <text x="66" y="200" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="21" fill="#6fa8a0">a terminal-native DAW built in Rust</text>

    <!-- stats line -->
    <text x="66" y="240" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="16" fill="#8f7fd8" opacity="0.95">8 synthesizers · 18 drum kits · 1,275 patches · 873 tests · zero allocations in the audio path</text>

    <!-- VU meters -->
    <g>
      <g transform="translate(1010,258)"><g><rect x="0" y="-150" width="20" height="150" fill="url(#vu)" rx="3"/><animateTransform attributeName="transform" type="scale" values="1 0.42;1 0.78;1 0.5;1 0.92;1 0.36;1 0.66;1 0.42" dur="1.7s" repeatCount="indefinite"/></g><rect x="0" y="-150" width="20" height="150" fill="none" rx="3" stroke="#173029"/></g>
      <g transform="translate(1042,258)"><g><rect x="0" y="-150" width="20" height="150" fill="url(#vu)" rx="3"/><animateTransform attributeName="transform" type="scale" values="1 0.65;1 0.35;1 0.85;1 0.45;1 0.7;1 0.3;1 0.65" dur="1.3s" repeatCount="indefinite"/></g><rect x="0" y="-150" width="20" height="150" fill="none" rx="3" stroke="#173029"/></g>
      <g transform="translate(1074,258)"><g><rect x="0" y="-150" width="20" height="150" fill="url(#vu)" rx="3"/><animateTransform attributeName="transform" type="scale" values="1 0.3;1 0.6;1 0.44;1 0.75;1 0.52;1 0.88;1 0.3" dur="2.1s" repeatCount="indefinite"/></g><rect x="0" y="-150" width="20" height="150" fill="none" rx="3" stroke="#173029"/></g>
      <g transform="translate(1106,258)"><g><rect x="0" y="-150" width="20" height="150" fill="url(#vu)" rx="3"/><animateTransform attributeName="transform" type="scale" values="1 0.8;1 0.5;1 0.95;1 0.4;1 0.68;1 0.55;1 0.8" dur="1.05s" repeatCount="indefinite"/></g><rect x="0" y="-150" width="20" height="150" fill="none" rx="3" stroke="#173029"/></g>
      <g transform="translate(1138,258)"><g><rect x="0" y="-150" width="20" height="150" fill="url(#vu)" rx="3"/><animateTransform attributeName="transform" type="scale" values="1 0.5;1 0.72;1 0.34;1 0.62;1 0.9;1 0.4;1 0.5" dur="1.55s" repeatCount="indefinite"/></g><rect x="0" y="-150" width="20" height="150" fill="none" rx="3" stroke="#173029"/></g>
      <g transform="translate(1170,258)"><g><rect x="0" y="-150" width="20" height="150" fill="url(#vu)" rx="3"/><animateTransform attributeName="transform" type="scale" values="1 0.38;1 0.82;1 0.55;1 0.3;1 0.74;1 0.6;1 0.38" dur="1.85s" repeatCount="indefinite"/></g><rect x="0" y="-150" width="20" height="150" fill="none" rx="3" stroke="#173029"/></g>
      <g transform="translate(1202,258)"><g><rect x="0" y="-150" width="20" height="150" fill="url(#vu)" rx="3"/><animateTransform attributeName="transform" type="scale" values="1 0.6;1 0.4;1 0.7;1 0.86;1 0.44;1 0.76;1 0.6" dur="1.25s" repeatCount="indefinite"/></g><rect x="0" y="-150" width="20" height="150" fill="none" rx="3" stroke="#173029"/></g>
    </g>

    <!-- CRT dressing -->
    <rect x="2" y="2" width="1276" height="296" fill="url(#scan)"/>
    <rect x="2" y="-60" width="1276" height="56" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 400" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="2" y="2" width="1276" height="296" fill="url(#vignette)"/>
  </g>
</svg>
