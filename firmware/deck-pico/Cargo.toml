[package]
name = "deck-pico"
version = "0.1.0"
description = "The Phosphor Deck's firmware for the Raspberry Pi Pico 2"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "deck-pico"
test = false
bench = false

[dependencies]
deck-logic = { path = "../deck-logic" }
embassy-rp = { version = "0.10", features = ["rp235xa", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5"
embassy-usb = "0.6"
embassy-sync = "0.8"
embassy-futures = "0.1"
smart-leds = "0.4"
cortex-m-rt = "0.7"
panic-halt = "1"
static_cell = "2"
